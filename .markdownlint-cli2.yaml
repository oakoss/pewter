# markdownlint-cli2 configuration
# See: https://github.com/DavidAnson/markdownlint-cli2#configuration

config:
  default: true
  MD007:
    indent: 2
  # MD013: prose wraps at editor width, not a hard limit
  MD013: false
  # MD024: bd emits duplicate headings into AGENTS.md
  MD024: false
  MD046:
    style: fenced

gitignore: true
noBanner: true
noProgress: true
ignores:
  # bd-managed, not ours to lint — --fix churn fights bd's renderer
  - .beads/
  # a bare @AGENTS.md import directive, not prose
  - CLAUDE.md
  # deliberately no h1 (the rendered PR's title supplies it), which MD041
  # rejects; the rest is guidance comments and h2 sections
  - .github/PULL_REQUEST_TEMPLATE.md
