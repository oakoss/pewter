[tools]
swiftformat = { version = "0.62.1", no_app = true, rename_exe = "swiftformat" }
xcodegen = "2.46.0"
lefthook = "2.1.10"
actionlint = "1.7.12"
zizmor = "1.28.0"
# node backs the npm: tools below; without it a fresh machine can't install them
node = "24.18.1"
"npm:markdownlint-cli2" = "0.23.2"
"npm:commitlint" = "21.2.1"
"npm:czg" = "1.13.1"

# Optional signing override for capture-pipeline work (see CONTRIBUTING.md):
# set SIGNING in untracked mise.local.toml, e.g.
#   [env]
#   SIGNING = 'CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" DEVELOPMENT_TEAM=YOURTEAMID'
# Command-line build settings override project.yml; env vars do not.
# CI appends CODE_SIGNING_ALLOWED=NO etc. via XCODE_SETTINGS the same way.

[tasks.ci]
description = "Everything CI runs: lint, test, and build, in parallel"
depends = ["lint", "test", "build"]

[tasks.gen]
description = "Regenerate Pewter.xcodeproj from project.yml"
# Always runs — no sources/outputs skip. xcodegen takes well under a
# second, its real inputs are the whole App tree (it globs), and mise's
# freshness check ignores some missing outputs (a deleted generated
# Info.plist did not trigger a re-run when tested). Correctness over a
# saved fraction of a second.
run = "xcodegen generate"

[tasks.build]
alias = "b"
description = "Build the app (Debug, into build/)"
depends = ["gen"]
# eval so quoted values inside $SIGNING ('CODE_SIGN_IDENTITY="Apple
# Development"') reach xcodebuild as one argument — plain expansion
# happens after quote parsing and would split them.
run = 'eval xcodebuild -project Pewter.xcodeproj -scheme Pewter -configuration Debug -derivedDataPath build "$SIGNING" "$XCODE_SETTINGS" build'

[tasks.test]
alias = "t"
description = "Core package unit tests"
run = "swift test --package-path Core"

[tasks.run]
description = "Build and (re)launch the app"
depends = ["build"]
# open won't replace a running instance; kill it or the fresh build
# silently never launches.
run = [
  "killall Pewter 2>/dev/null || true",
  "open build/Build/Products/Debug/Pewter.app",
]

[tasks.format]
alias = "f"
description = "Fix Swift and markdown formatting"
run = [
  "swiftformat .",
  'markdownlint-cli2 --fix "**/*.md"',
]

[tasks.lint]
alias = "l"
description = "Check Swift, markdown, and workflow files"
# ${ZIZMOR_FLAGS---offline}: --offline unless the caller sets the var —
# CI sets it empty so zizmor's online audits run there.
run = [
  "swiftformat --lint .",
  'markdownlint-cli2 "**/*.md"',
  "actionlint",
  "zizmor ${ZIZMOR_FLAGS---offline} .github/workflows",
]

[tasks.logs]
description = "Tail the app's unified-logging output"
# --level debug: the default stream level drops info/debug, which is most
# of the capture decision trail. Full path keeps the line copy-paste-safe
# in zsh, where `log` is a builtin.
run = "/usr/bin/log stream --predicate 'subsystem == \"com.oakoss.Pewter\"' --level debug --style compact"

[tasks.clean]
description = "Remove generated project and build products"
run = "rm -rf build Pewter.xcodeproj Core/.build"

[tasks.icon]
description = "Render AppIcon.appiconset PNGs from App/AppIcon.svg"
# The alpha assertion exists because a filter primitive the renderer
# doesn't implement silently yields fully transparent output — a blank
# icon passes every downstream build check.
run = """
set -e
dest=App/Resources/Assets.xcassets/AppIcon.appiconset
for px in 16 32 64 128 256 512 1024; do
  inkscape App/AppIcon.svg -w "$px" -h "$px" -o "$dest/icon_${px}.png"
done
swift -e 'import AppKit
let path = "App/Resources/Assets.xcassets/AppIcon.appiconset/icon_1024.png"
let rep = NSBitmapImageRep(data: try! Data(contentsOf: URL(fileURLWithPath: path)))!
guard let c = rep.colorAt(x: 512, y: 512), c.alphaComponent > 0.5 else {
  fatalError("transparent render — check the SVG filters")
}
print("alpha check passed")'
"""
