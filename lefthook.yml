output:
  - failure # Only show failed steps
  - execution_out # Show command output

# beads (bd) also uses git hooks for issue-db sync; lefthook owns the hooks
# and delegates to bd's tracked shims in .beads/hooks/, which guard against
# a missing bd binary, add a timeout, and normalize exit codes. {0} forwards
# git's hook arguments — "$@" would be empty in lefthook's child shell.

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.swift'
      run: swiftformat {staged_files}
      stage_fixed: true
    lint-md:
      glob: '*.md'
      run: markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
    lint-workflows:
      glob: '.github/workflows/*.yml'
      run: actionlint {staged_files} && zizmor --offline {staged_files}
    # Every YAML file, workflows included, not only the ones actionlint reads:
    # lefthook.yml and project.yml drive every git hook and the Xcode project,
    # and nothing else checks them.
    lint-yaml:
      glob: '*.{yml,yaml}'
      run: yamllint {staged_files}
    beads:
      run: .beads/hooks/pre-commit {0}

prepare-commit-msg:
  commands:
    beads:
      run: .beads/hooks/prepare-commit-msg {0}

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit {1}

pre-push:
  # piped: a test failure short-circuits the bd sync
  piped: true
  commands:
    core-tests:
      run: swift test --package-path Core
    # Skipped unless the push touches workflow files. Blocks only on real
    # zizmor findings (exit 11-14); everything else (no network, no token,
    # missing mise, signals) warns and passes — CI runs the same audits as
    # the backstop.
    zizmor-online:
      glob: '.github/workflows/*.yml'
      run: |
        mise run lint:online
        rc=$?
        [ "$rc" -ge 11 ] && [ "$rc" -le 14 ] && exit "$rc"
        [ "$rc" -ne 0 ] && echo "zizmor online audits unavailable (rc=$rc); CI is the backstop" >&2
        exit 0
    beads:
      # git's pre-push protocol delivers the ref list on stdin
      use_stdin: true
      run: .beads/hooks/pre-push {0}
    # bd's own pre-push hook does not push Dolt history; without this, issue
    # work never leaves the machine. Bounded and non-interactive because
    # `exit 0` only runs once the command returns — a stalled remote or a
    # passphrase prompt would hang every push. A missed sync is recoverable.
    dolt-push:
      run: |
        timeout_s=${BEADS_HOOK_TIMEOUT:-120}
        export GIT_TERMINAL_PROMPT=0
        export GIT_SSH_COMMAND="ssh -o BatchMode=yes"
        if command -v timeout >/dev/null 2>&1; then
          timeout "$timeout_s" bd dolt push
        elif command -v gtimeout >/dev/null 2>&1; then
          gtimeout "$timeout_s" bd dolt push
        elif command -v perl >/dev/null 2>&1; then
          perl -e 'alarm shift; exec @ARGV' "$timeout_s" bd dolt push
        else
          echo "no timeout available; skipping bd dolt push" >&2
        fi || echo "bd dolt push skipped or failed; issue history not synced this push" >&2
        exit 0

post-checkout:
  commands:
    beads:
      run: .beads/hooks/post-checkout {0}

post-merge:
  commands:
    beads:
      run: .beads/hooks/post-merge {0}
