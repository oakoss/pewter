name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review added so leaving draft state re-runs the gate —
    # Copilot doesn't review drafts, and the copilot-review job skips them.
    types: [opened, synchronize, reopened, ready_for_review]

# The default token is write-scoped org-wide; with read-only permissions a
# compromised dep in any job can't post a forged "CI Summary" status.
permissions:
  contents: read

# PRs share a per-number group so a superseded push cancels the stale run.
# Everything else gets a unique group: a shared main group would let a
# freshly queued run displace a still-pending one (the group queue keeps
# only one pending run regardless of cancel-in-progress).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # macos-15 ships Xcode 16.4, whose Swift still gates `isolated deinit`
    # behind an experimental flag; the app needs an Xcode 26 toolchain.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing after checkout needs git auth; keep the token out of
          # .git/config.
          persist-credentials: false

      - name: Install tools
        # mise.toml is the single source of tool versions — CI runs exactly
        # what local dev runs, and Renovate bumps both at once.
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # Steps run the mise tasks so CI and local dev can't drift on what
      # "lint", "test", and "build" mean.
      - name: Lint
        # Empty ZIZMOR_FLAGS drops the local default --offline: with a token
        # zizmor's online audits (known-vulnerable-actions, stale refs) also
        # cover Renovate digest bumps and web-UI edits that skip the hook.
        env:
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_FLAGS: ""
        run: mise run lint

      - name: Core tests
        run: mise run test

      - name: Build app
        # Unsigned, and CI has no use for the source index Xcode builds for
        # IDE features.
        env:
          XCODE_SETTINGS: CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
        run: mise run build

  # Holds the merge gate open until Copilot's review lands, so review
  # feedback exists before the required check can pass — the repo ruleset's
  # thread-resolution rule then keeps unaddressed comments blocking.
  # Depends on the org ruleset's copilot_code_review rule with
  # review_on_push enabled — the head-SHA match below needs a fresh review
  # per push; without it every PR times out here.
  copilot-review:
    name: Copilot review posted
    runs-on: ubuntu-latest
    # The polling script self-limits at ~10.5 minutes; this is the backstop
    # with enough margin that slow API calls still reach the script's own
    # clearer failure message.
    timeout-minutes: 15
    permissions:
      pull-requests: read
    steps:
      - name: Wait for Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pushes to main have no PR; Copilot skips drafts; Renovate PRs
          # aren't Copilot-reviewed and must keep automerging. The bot
          # patterns are quoted — unquoted, [bot] is a bracket expression.
          if [ -z "$PR" ] || [ "$DRAFT" = "true" ]; then exit 0; fi
          case "$AUTHOR" in 'renovate[bot]'|'dependabot[bot]') exit 0 ;; esac
          for _ in $(seq 1 40); do
            # The review must be for the current head — a stale review from
            # an earlier push must not satisfy the gate. Paginated because
            # review_on_push accumulates one review per push, oldest first.
            # Transient API failures wait for the next tick instead of
            # failing the check.
            # Exact bot login: anyone can review a public PR, so a substring
            # match could be satisfied by any account with "copilot" in its
            # name.
            count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews?per_page=100" \
              --jq '.[] | select(.commit_id == env.HEAD_SHA and .user.login == "copilot-pull-request-reviewer[bot]") | .id' \
              | wc -l) || count=0
            if [ "${count:-0}" -gt 0 ]; then exit 0; fi
            sleep 15
          done
          echo "No Copilot review after 10 minutes; re-run this job once it posts"
          exit 1

  # Fan-in gate: the one required status check, so the branch ruleset never
  # names individual jobs. Every job in this workflow must be listed in
  # `needs` — an omitted job is invisible to the gate.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # always(), not !cancelled(): a skipped required check counts as
    # satisfied, so cancellation must yield a red X here, not a skip.
    if: always()
    needs: [build-and-test, copilot-review]
    steps:
      - name: Summarize results
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Status | Required |"
            echo "| --- | --- | --- |"
            echo "| Build and test | \`${{ needs.build-and-test.result }}\` | ✅ Yes |"
            echo "| Copilot review posted | \`${{ needs.copilot-review.result }}\` | ✅ Yes |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs did not succeed: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
