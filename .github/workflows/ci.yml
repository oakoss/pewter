name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macos-15 ships Xcode 16.4, whose Swift still gates `isolated deinit`
    # behind an experimental flag; the app needs an Xcode 26 toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftformat

      - name: Lint
        run: swiftformat --lint .

      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Core tests
        run: swift test --package-path Core

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: >
          xcodebuild -project Pewter.xcodeproj -scheme Pewter
          -configuration Debug CODE_SIGNING_ALLOWED=NO build
