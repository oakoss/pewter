name: CodeQL

# No pull_request trigger: the Swift analysis takes 20-25 minutes (a full
# instrumented rebuild) and the check is advisory, so it runs after merge
# instead of on every PR push. Every merged commit that touches Swift is
# still scanned, with alerts on main minutes after landing. Analysis only
# sees compiled Swift, so config-only pushes skip it; the weekly cron
# scans everything regardless of paths.
on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Core/**"
      - "project.yml"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "30 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # Default setup's autobuild only compiled the Core package, so App/ —
    # the AX, clipboard, and event-tap code — was never analyzed. Manual
    # build mode compiles the app target, which pulls in Core too.
    name: Analyze (swift)
    runs-on: macos-26
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tool install stays above init so the CodeQL trace window contains
      # only the app build — a source-built xcodegen would otherwise be
      # extracted into the database alongside Pewter's own code.
      - name: Install tools
        run: |
          brew untap aws/tap || true
          brew install xcodegen

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build app
        run: |
          xcodegen generate
          xcodebuild -project Pewter.xcodeproj -scheme Pewter -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:swift"
