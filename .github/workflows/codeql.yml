name: CodeQL

# No pull_request trigger: the Swift analysis takes 20-25 minutes (a full
# instrumented rebuild) and the check is advisory, so it runs after merge
# instead of on every PR push. Every merged commit that touches Swift is
# still scanned, with alerts on main minutes after landing. Analysis only
# sees compiled Swift, so config-only pushes skip it; the weekly cron
# scans everything regardless of paths.
on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Core/**"
      - "project.yml"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "30 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # Default setup's autobuild only compiled the Core package, so App/ —
    # the AX, clipboard, and event-tap code — was never analyzed. Manual
    # build mode compiles the app target, which pulls in Core too.
    name: Analyze (swift)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs git auth; keep the token out of
          # .git/config.
          persist-credentials: false

      # Tool install stays above init so the CodeQL trace window contains
      # only the app build — tools built from source during the trace would
      # be extracted into the database alongside Pewter's own code.
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # This job needs nothing else; the full toolchain would be dead
          # weight inside the one job holding security-events: write.
          install_args: xcodegen

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build app
        # The build task runs xcodegen first; both execute inside the CodeQL
        # trace window, which only extracts the Swift compilation. Task-time
        # auto-install is off so the lean install_args above isn't undone.
        env:
          XCODE_SETTINGS: CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:swift"
