name: Pewter
options:
  bundleIdPrefix: com.oakoss
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  PewterCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing so a clean clone builds with no Apple account.
    # Capture testing needs a stable identity — see CONTRIBUTING.md.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  Pewter:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: PewterCore
    entitlements:
      path: App/Pewter.entitlements
      properties:
        com.apple.security.app-sandbox: false
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDisplayName: Pewter
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License — oakoss"
        # Persist debug-level entries for our subsystem: OSLogStore (Copy
        # Diagnostics) only returns persisted entries, and the capture tier
        # decisions log at .debug. Volume is a few lines per capture.
        OSLogPreferences:
          com.oakoss.Pewter:
            DEFAULT-OPTIONS:
              Level:
                Enable: Debug
                Persist: Debug

schemes:
  Pewter:
    build:
      targets:
        Pewter: all
    run:
      config: Debug
